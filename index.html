<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看社交</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #ddd;
            --primary-color: #1877f2;
        }
        body.dark {
            --bg-color: #18191a;
            --text-color: #e4e6eb;
            --card-bg: #242526;
            --border-color: #393a3b;
            --primary-color: #2d88ff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 {
            margin: 0;
            color: var(--primary-color);
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 14px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        textarea, input {
            width: 100%;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .banner {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
            display: none;
            font-size: 14px;
        }
        body.dark .banner {
            background-color: #2c2915;
            color: #fce883;
            border-color: #443c13;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .post-item, .chat-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .post-item:last-child, .chat-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部導覽列 -->
        <header>
            <h1>看社交</h1>
            <div class="btn-group">
                <button id="themeToggleBtn" onclick="toggleTheme()">🌙 夜晚</button>
                <button id="authBtn" onclick="handleAuth()">Google 登入</button>
            </div>
        </header>

        <!-- 防焦慮與護眼健康提醒 Banner -->
        <div id="wellbeingBanner" class="banner">
            ⚠️ <strong>溫馨提醒：</strong>您已經瀏覽社交動態滿 20 分鐘了，建議站起來活動一下、眺望遠方保護眼睛！
        </div>

        <!-- 頁籤切換 -->
        <div class="tabs">
            <div class="tab-btn active" onclick="switchView('home')">🏠 主頁動態</div>
            <div class="tab-btn" onclick="switchView('chat')">💬 訊息聊天</div>
        </div>

        <!-- 主頁檢視 (Home View) -->
        <div id="homeView" class="view-section active">
            <div class="card">
                <h3>建立新貼文</h3>
                <textarea id="postInput" placeholder="分享你的新鮮事..."></textarea>
                <button onclick="createPost()">發布貼文</button>
            </div>

            <div class="card">
                <h3>動態牆</h3>
                <div id="postsFeed">
                    <div class="post-item">
                        <p><strong>系統公告：</strong> 歡迎來到「看社交」！試著發布第一篇貼文或切換成夜晚模式看看吧。</p>
                        <small style="color: gray;">剛剛</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- 聊天檢視 (Chat View) -->
        <div id="chatView" class="view-section">
            <div class="card">
                <h3>尋找用戶</h3>
                <input type="text" id="searchInput" placeholder="輸入 @username 搜尋聊天對象...">
                <button onclick="searchUser()">搜尋</button>
            </div>

            <div class="card">
                <h3>聊天列表</h3>
                <div id="chatList">
                    <div class="chat-item" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>@system_support (官方小幫手)</span>
                        <div class="btn-group">
                            <button onclick="alert('已釘選聊天室')">📌 釘選</button>
                            <button onclick="alert('已刪除對話')">刪除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ================= 1. Cookie 操作函式 ================= */
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "; expires=" + date.toUTCString();
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        /* ================= 2. 主題切換與 Cookie 初始化 ================= */
        function initTheme() {
            const savedTheme = getCookie("theme");
            const btn = document.getElementById("themeToggleBtn");
            if (savedTheme === "dark") {
                document.body.classList.add("dark");
                btn.textContent = "☀️ 白天";
            } else {
                document.body.classList.remove("dark");
                btn.textContent = "🌙 夜晚";
            }
        }

        function toggleTheme() {
            const btn = document.getElementById("themeToggleBtn");
            if (document.body.classList.contains("dark")) {
                document.body.classList.remove("dark");
                setCookie("theme", "light", 30); // 記錄 30 天
                btn.textContent = "🌙 夜晚";
            } else {
                document.body.classList.add("dark");
                setCookie("theme", "dark", 30); // 記錄 30 天
                btn.textContent = "☀️ 白天";
            }
        }

        /* ================= 3. 頁面介面與互動邏輯 ================= */
        function switchView(viewName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            if (viewName === 'home') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('homeView').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('chatView').classList.add('active');
            }
        }

        function createPost() {
            const input = document.getElementById('postInput');
            const content = input.value.trim();
            if (!content) {
                alert('貼文內容不能為空！');
                return;
            }

            const feed = document.getElementById('postsFeed');
            const newPost = document.createElement('div');
            newPost.className = 'post-item';
            newPost.innerHTML = `<p><strong>我：</strong> ${escapeHtml(content)}</p><small style="color: gray;">剛剛</small>`;
            feed.prepend(newPost);
            input.value = '';
        }

        function searchUser() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('請輸入要搜尋的帳號');
                return;
            }
            alert(`正在搜尋使用者: ${query} (此處可對接 Firebase 查詢)`);
        }

        function handleAuth() {
            const btn = document.getElementById('authBtn');
            if (btn.textContent === 'Google 登入') {
                // 這裡預留您的 Firebase Google 登入邏輯
                btn.textContent = '登出';
                alert('模擬 Firebase Google 登入成功！');
            } else {
                btn.textContent = 'Google 登入';
                alert('已登出');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        /* ================= 4. 初始化執行 ================= */
        window.onload = function() {
            // 初始化 Cookie 主題偏好
            initTheme();
            
            // 防焦慮護眼提醒計時器 (測試用 10 秒，正式環境可改為 20 * 60 * 1000)
            setTimeout(() => {
                document.getElementById("wellbeingBanner").style.display = "block";
            }, 10000);
        };
    </script>
</body>
</html>
