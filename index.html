<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的社群 App</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #1877f2;
      --border-color: #ccd0d5;
    }
    body.dark-mode {
      --bg-color: #18191a;
      --card-bg: #242526;
      --text-color: #e4e6eb;
      --primary-color: #2d88ff;
      --border-color: #393a3b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      border: 1px solid var(--border-color);
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--bg-color);
      color: var(--text-color);
      resize: none;
      box-sizing: border-box;
    }
    .post-item {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .post-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    .banner {
      background: #e7f3ff;
      color: #050505;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      border-bottom: 1px solid #bdd7f5;
    }
  </style>
</head>
<body>

  <div id="cookie-banner" class="banner">
    我們使用 Cookies 來提升您的瀏覽體驗。<button onclick="acceptCookies()" style="margin-left: 10px; padding: 4px 8px; font-size: 12px;">同意</button>
  </div>

  <header>
    <h2>🌐 我的社群 App</h2>
    <div class="nav-actions">
      <button onclick="toggleDarkMode()">🌙 模式</button>
      <div id="auth-container">
        <button id="login-btn" onclick="login()">Google 登入</button>
        <button id="logout-btn" onclick="logout()" style="display:none; background-color: #e41e3f;">登出</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- 發文區塊 (未登入時可瀏覽但會提示) -->
    <div class="card">
      <h3>分享新鮮事</h3>
      <div id="post-area">
        <textarea id="post-content" placeholder="在想些什麼呢？（需登入才能發文）"></textarea>
        <div style="text-align: right; margin-top: 8px;">
          <button onclick="createPost()">發佈貼文</button>
        </div>
      </div>
    </div>

    <!-- 貼文牆 (未登入也能直接看) -->
    <div class="card">
      <h3>動態牆</h3>
      <div id="posts-container">載入中...</div>
    </div>
  </div>

  <script>
    // TODO: 填入您的 Firebase 設定
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Google 登入
    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => {
        alert("登入失敗: " + error.message);
      });
    }

    // 登出
    function logout() {
      auth.signOut();
    }

    // 監聽登入狀態
    auth.onAuthStateChanged((user) => {
      const loginBtn = document.getElementById('login-btn');
      const logoutBtn = document.getElementById('logout-btn');
      
      if (user) {
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
        console.log("已登入使用者:", user.displayName);
      } else {
        loginBtn.style.display = 'block';
        logoutBtn.style.display = 'none';
        console.log("目前為訪客瀏覽狀態");
      }
    });

    // 發表貼文
    function createPost() {
      const user = auth.currentUser;
      if (!user) {
        alert("請先點擊右上角進行 Google 登入才能發文！");
        return;
      }
      const content = document.getElementById('post-content').value;
      if (!content.trim()) {
        alert("內容不能為空！");
        return;
      }

      db.collection("posts").add({
        content: content,
        author: user.displayName || "匿名使用者",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('post-content').value = '';
        loadPosts();
      }).catch((error) => {
        alert("發文失敗: " + error.message);
      });
    }

    // 載入貼文 (不需登入即可讀取)
    function loadPosts() {
      db.collection("posts").orderBy("createdAt", "desc").get().then((querySnapshot) => {
        const container = document.getElementById('posts-container');
        container.innerHTML = '';
        if (querySnapshot.empty) {
          container.innerHTML = '<p style="color: gray;">目前沒有任何貼文，趕快來發第一篇吧！</p>';
          return;
        }
        querySnapshot.forEach((doc) => {
          const post = doc.data();
          const div = document.createElement('div');
          div.className = 'post-item';
          div.innerHTML = `
            <strong>${post.author || '匿名'}</strong>
            <p style="margin: 6px 0;">${escapeHtml(post.content)}</p>
          `;
          container.appendChild(div);
        });
      });
    }

    // 防止 XSS 簡單跳脫
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 切換深色模式
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    // Cookie 同意橫幅
    function acceptCookies() {
      document.getElementById('cookie-banner').style.display = 'none';
    }

    // 初始化載入貼文
    loadPosts();
  </script>
</body>
</html>
