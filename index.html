<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看社交 - 完整社群平台與多元登入</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 主容器 -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">
        <h2 class="text-xs uppercase tracking-widest text-slate-400 mb-1">Player Access</h2>
        <h1 class="text-2xl font-bold mb-6">登入帳號</h1>

        <!-- 登入 / 註冊切換標籤 -->
        <div class="flex bg-slate-800 p-1 rounded-xl mb-6">
            <button id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-lg bg-slate-700 text-white shadow">登入</button>
            <button id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white">註冊</button>
        </div>

        <!-- 錯誤訊息提示框 -->
        <div id="error-alert" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl"></div>

        <!-- 電子郵件密碼表單 -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">電子郵件</label>
                <input type="email" id="email" required placeholder="name@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">密碼</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">
                登入帳號
            </button>
        </form>

        <!-- 分隔線 -->
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-xs">或使用第三方帳號</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- 第三方登入按鈕 -->
        <div class="grid grid-cols-2 gap-3">
            <button id="google-login-btn" type="button" class="flex items-center justify-center py-2.5 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm font-medium transition">
                Google
            </button>
            <button id="discord-login-btn" type="button" class="flex items-center justify-center py-2.5 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm font-medium transition">
                Discord
            </button>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            登入即表示您同意本平台的服務條款與隱私權規範。
        </p>
    </div>

    <!-- Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase 設定與全新 API 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyAEgl4yoNIfZhvjjPC8ZRGqUFAs8ptX_bw",
            authDomain: "my-social-app-74cb5.firebaseapp.com",
            projectId: "my-social-app-74cb5",
            storageBucket: "my-social-app-74cb5.firebasestorage.app",
            messagingSenderId: "296934453383",
            appId: "1:296934453383:web:89ba9204d283fe37788822",
            measurementId: "G-T5EE6DRD3E"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLoginMode = true;

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        const authForm = document.getElementById('auth-form');
        const errorAlert = document.getElementById('error-alert');
        const googleLoginBtn = document.getElementById('google-login-btn');

        // 切換登入 / 註冊介面
        tabLogin.addEventListener('click', () => {
            isLoginMode = true;
            tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-slate-700 text-white shadow";
            tabRegister.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white";
            submitBtn.textContent = "登入帳號";
            errorAlert.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            isLoginMode = false;
            tabRegister.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-slate-700 text-white shadow";
            tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white";
            submitBtn.textContent = "註冊帳號";
            errorAlert.classList.add('hidden');
        });

        // 顯示錯誤訊息
        function showError(message) {
            errorAlert.textContent = "登入失敗: " + message;
            errorAlert.classList.remove('hidden');
        }

        // Email / 密碼 表單送出
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                    alert("登入成功！");
                } else {
                    await auth.createUserWithEmailAndPassword(email, password);
                    alert("註冊成功！");
                }
            } catch (error) {
                showError(error.message);
            }
        });

        // Google 第三方登入
        googleLoginBtn.addEventListener('click', async () => {
            errorAlert.classList.add('hidden');
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
                alert("Google 登入成功！");
            } catch (error) {
                showError(error.message);
            }
        });
    </script>
</body>
</html>
